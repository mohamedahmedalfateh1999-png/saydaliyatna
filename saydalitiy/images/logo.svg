<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Shield / Medical Emblem -->
    <rect x="2" y="2" width="50" height="50" rx="14" fill="url(#medGrad)" />
    <!-- White Medical Cross -->
    <path d="M27 14 L27 40 M14 27 L40 27" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <!-- Small Leaf / Capsule accent -->
    <circle cx="38" cy="16" r="4.5" fill="#34d399" />
  </g>
  <!-- Brand Text -->
  <text x="75" y="38" font-family="'Cairo', 'Tajawal', sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">صيدليتنا</text>
  <text x="75" y="55" font-family="'Cairo', 'Tajawal', sans-serif" font-size="12" font-weight="600" fill="#059669">دليل صيدليات ولاية الخرطوم</text>
</svg>
